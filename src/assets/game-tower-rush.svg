<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="towerSky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="crateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="towerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="32" fill="url(#towerSky)" />
  <rect width="504" height="504" x="4" y="4" rx="28" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3" />

  <!-- Castle Turret Silhouette in Background -->
  <path d="M 120,500 L 120,200 L 140,200 L 140,160 L 170,160 L 170,200 L 200,200 L 200,160 L 230,160 L 230,200 L 280,200 L 280,160 L 310,160 L 310,200 L 340,200 L 340,160 L 370,160 L 370,200 L 392,200 L 392,500 Z" fill="#090d16" />

  <!-- Tower Floors Stack (Ascending Multiplier Levels) -->
  <!-- Floor 1 (Bottom Base) -->
  <g transform="translate(96, 380)">
    <rect width="320" height="70" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- 3 Crates -->
    <rect x="25" y="10" width="75" height="50" rx="8" fill="url(#crateGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="62" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fef08a" text-anchor="middle">✓ 1.3x</text>

    <rect x="122" y="10" width="75" height="50" rx="8" fill="url(#crateGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="160" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fef08a" text-anchor="middle">✓ 1.3x</text>

    <rect x="220" y="10" width="75" height="50" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
    <text x="257" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fca5a5" text-anchor="middle">✕ SKULL</text>
  </g>

  <!-- Floor 2 (Middle Active Floor) -->
  <g transform="translate(116, 280)" filter="url(#towerGlow)">
    <rect width="280" height="75" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="3" />
    <!-- Crates -->
    <rect x="20" y="12" width="68" height="50" rx="8" fill="url(#goldFloor)" stroke="#ffffff" stroke-width="2" />
    <text x="54" y="43" font-family="system-ui, sans-serif" font-size="16" font-weight="950" fill="#78350f" text-anchor="middle">2.8x</text>

    <rect x="106" y="12" width="68" height="50" rx="8" fill="url(#goldFloor)" stroke="#ffffff" stroke-width="2" />
    <text x="140" y="43" font-family="system-ui, sans-serif" font-size="16" font-weight="950" fill="#78350f" text-anchor="middle">2.8x</text>

    <rect x="192" y="12" width="68" height="50" rx="8" fill="url(#crateGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="226" y="43" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fef08a" text-anchor="middle">?</text>
  </g>

  <!-- Floor 3 (Top Jackpot Pinnacle) -->
  <g transform="translate(146, 175)">
    <rect width="220" height="80" rx="12" fill="#1e1b4b" stroke="#eab308" stroke-width="2.5" />
    <circle cx="110" cy="40" r="30" fill="url(#goldFloor)" stroke="#ffffff" stroke-width="2" filter="url(#towerGlow)" />
    <text x="110" y="47" font-family="system-ui, sans-serif" font-size="20" font-weight="950" fill="#78350f" text-anchor="middle">10x</text>
  </g>

  <!-- Sparkles -->
  <g fill="#fef08a" filter="url(#towerGlow)">
    <polygon points="120,130 123,138 131,141 123,144 120,152 117,144 109,141 117,138" />
    <polygon points="380,140 383,148 391,151 383,154 380,162 377,154 369,151 377,148" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(136, 44)">
    <rect width="240" height="48" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" />
    <text x="120" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="950" fill="#facc15" text-anchor="middle">TOWER RUSH</text>
  </g>
</svg>
