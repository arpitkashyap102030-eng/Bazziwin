<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="grBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="60%" stop-color="#180402" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#grBg)" />
  <!-- Rocket launch -->
  <g transform="translate(256, 260) rotate(-40)">
    <!-- Fire Flame -->
    <path d="M -20,0 L -90,-20 L -60,0 L -90,20 Z" fill="#ef4444" />
    <path d="M -15,0 L -60,-10 L -45,0 L -60,10 Z" fill="#facc15" />
    <!-- Rocket Cylinder -->
    <ellipse cx="20" cy="0" rx="60" ry="24" fill="#ea580c" stroke="#fed7aa" stroke-width="2" />
    <!-- Nosecone -->
    <path d="M 80,0 L 40,-24 L 40,24 Z" fill="#dc2626" />
    <!-- Fins -->
    <polygon points="-10,-24 -40,-55 10,-24" fill="#7c2d12" />
    <polygon points="-10,24 -40,55 10,24" fill="#7c2d12" />
    <!-- Porthole -->
    <circle cx="30" cy="0" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  </g>
  <text x="256" y="80" font-family="system-ui, sans-serif" font-size="34" font-weight="950" fill="#f97316" text-anchor="middle">GO RUSH</text>
</svg>
