<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bombSky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="bombCore" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="bombGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="32" fill="url(#bombSky)" />
  <rect width="504" height="504" x="4" y="4" rx="28" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.4" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="120" r="2" />
    <circle cx="430" cy="110" r="2.5" />
    <circle cx="100" cy="400" r="2" />
    <circle cx="420" cy="410" r="2" />
  </g>

  <!-- Giant Sci-Fi Plasma Bomb in Center -->
  <g transform="translate(256, 250)" filter="url(#bombGlow)">
    <!-- Shockwave Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="10,10" opacity="0.5" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="15,15" opacity="0.3" />

    <!-- Bomb Body Sphere -->
    <circle cx="0" cy="0" r="105" fill="url(#bombCore)" stroke="#f43f5e" stroke-width="4" />

    <!-- Bomb Cap & Fuse Top -->
    <rect x="-24" y="-130" width="48" height="28" rx="6" fill="#64748b" stroke="#f43f5e" stroke-width="2" />
    <path d="M 0,-130 C 15,-160 40,-150 50,-175" fill="none" stroke="#facc15" stroke-width="5" stroke-linecap="round" />
    
    <!-- Sparking Fuse Fire Tip -->
    <circle cx="50" cy="-175" r="16" fill="#facc15" filter="url(#bombGlow)" />
    <circle cx="50" cy="-175" r="8" fill="#ffffff" />

    <!-- Danger Biohazard / Nuclear Logo on Bomb Body -->
    <g transform="translate(0, -10)" stroke="#f43f5e" stroke-width="3" fill="#f43f5e">
      <circle cx="0" cy="0" r="10" />
      <path d="M -25,-25 A 35,35 0 0,1 25,-25 L 14,-14 A 20,20 0 0,0 -14,-14 Z" opacity="0.85" />
      <path d="M 30,10 A 35,35 0 0,1 0,40 L 0,20 A 20,20 0 0,0 15,5 Z" opacity="0.85" />
      <path d="M -30,10 A 35,35 0 0,1 0,40 L 0,20 A 20,20 0 0,0 -15,5 Z" opacity="0.85" />
    </g>

    <!-- Digital Countdown Timer Display on Bomb -->
    <rect x="-60" y="45" width="120" height="34" rx="8" fill="#000000" stroke="#f43f5e" stroke-width="2" />
    <text x="0" y="69" font-family="monospace" font-size="20" font-weight="900" fill="#f43f5e" text-anchor="middle" letter-spacing="2">00:03.4</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(136, 44)">
    <rect width="240" height="48" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="2.5" />
    <text x="120" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="950" fill="#fb7185" text-anchor="middle">SPACE BOMB</text>
  </g>
</svg>
