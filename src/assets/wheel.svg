<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Rim Gradient -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#78350f" />
      <stop offset="92%" stop-color="#f59e0b" />
      <stop offset="97%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    
    <!-- Central Hub Gradient -->
    <radialGradient id="hubGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>

    <!-- Sector Gradients -->
    <radialGradient id="secRed" cx="50%" cy="50%" r="50%"><stop offset="40%" stop-color="#ef4444" /><stop offset="100%" stop-color="#991b1b" /></radialGradient>
    <radialGradient id="secEmerald" cx="50%" cy="50%" r="50%"><stop offset="40%" stop-color="#10b981" /><stop offset="100%" stop-color="#065f46" /></radialGradient>
    <radialGradient id="secPurple" cx="50%" cy="50%" r="50%"><stop offset="40%" stop-color="#a855f7" /><stop offset="100%" stop-color="#581c87" /></radialGradient>
    <radialGradient id="secAmber" cx="50%" cy="50%" r="50%"><stop offset="40%" stop-color="#f59e0b" /><stop offset="100%" stop-color="#78350f" /></radialGradient>
    <radialGradient id="secBlue" cx="50%" cy="50%" r="50%"><stop offset="40%" stop-color="#3b82f6" /><stop offset="100%" stop-color="#1e3a8a" /></radialGradient>
    <radialGradient id="secPink" cx="50%" cy="50%" r="50%"><stop offset="40%" stop-color="#ec4899" /><stop offset="100%" stop-color="#831843" /></radialGradient>
    <radialGradient id="secJackpot" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fef08a" /><stop offset="60%" stop-color="#eab308" /><stop offset="100%" stop-color="#713f12" /></radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Shadow & Base -->
  <circle cx="256" cy="256" r="250" fill="#0f172a" stroke="#000000" stroke-width="6" />
  <circle cx="256" cy="256" r="242" fill="url(#rimGrad)" />
  <circle cx="256" cy="256" r="222" fill="#1e1b4b" stroke="#78350f" stroke-width="4" />

  <!-- 8 Wheel Sectors (45 deg each centered at 0, 45, 90, 135, 180, 225, 270, 315) -->
  <!-- Sector 0 (Right, 0 deg) : Red 20 -->
  <path d="M 256,256 L 476,164.8 A 220,220 0 0,1 476,347.2 Z" fill="url(#secRed)" stroke="#fef08a" stroke-width="2.5" />
  <g transform="translate(370, 256) rotate(0)">
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.8))">20</text>
  </g>

  <!-- Sector 1 (Bottom-Right, 45 deg) : Emerald 50 -->
  <path d="M 256,256 L 476,347.2 A 220,220 0 0,1 347.2,476 Z" fill="url(#secEmerald)" stroke="#fef08a" stroke-width="2.5" />
  <g transform="translate(337, 337) rotate(45)">
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.8))">50</text>
  </g>

  <!-- Sector 2 (Bottom, 90 deg) : Purple 30 -->
  <path d="M 256,256 L 347.2,476 A 220,220 0 0,1 164.8,476 Z" fill="url(#secPurple)" stroke="#fef08a" stroke-width="2.5" />
  <g transform="translate(256, 370) rotate(90)">
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.8))">30</text>
  </g>

  <!-- Sector 3 (Bottom-Left, 135 deg) : Amber 100 -->
  <path d="M 256,256 L 164.8,476 A 220,220 0 0,1 36,347.2 Z" fill="url(#secAmber)" stroke="#fef08a" stroke-width="2.5" />
  <g transform="translate(175, 337) rotate(135)">
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.8))">100</text>
  </g>

  <!-- Sector 4 (Left, 180 deg) : Blue 20 -->
  <path d="M 256,256 L 36,347.2 A 220,220 0 0,1 36,164.8 Z" fill="url(#secBlue)" stroke="#fef08a" stroke-width="2.5" />
  <g transform="translate(142, 256) rotate(180)">
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.8))">20</text>
  </g>

  <!-- Sector 5 (Top-Left, 225 deg) : Pink 75 -->
  <path d="M 256,256 L 36,164.8 A 220,220 0 0,1 164.8,36 Z" fill="url(#secPink)" stroke="#fef08a" stroke-width="2.5" />
  <g transform="translate(175, 175) rotate(225)">
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.8))">75</text>
  </g>

  <!-- Sector 6 (Top, 270 deg) : Emerald 50 -->
  <path d="M 256,256 L 164.8,36 A 220,220 0 0,1 347.2,36 Z" fill="url(#secEmerald)" stroke="#fef08a" stroke-width="2.5" />
  <g transform="translate(256, 142) rotate(270)">
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.8))">50</text>
  </g>

  <!-- Sector 7 (Top-Right, 315 deg) : Golden Jackpot 250 -->
  <path d="M 256,256 L 347.2,36 A 220,220 0 0,1 476,164.8 Z" fill="url(#secJackpot)" stroke="#ffffff" stroke-width="3" />
  <g transform="translate(337, 175) rotate(315)">
    <text x="0" y="-4" font-family="system-ui, sans-serif" font-size="11" font-weight="950" fill="#78350f" text-anchor="middle">JACKPOT</text>
    <text x="0" y="14" font-family="system-ui, sans-serif" font-size="20" font-weight="950" fill="#78350f" text-anchor="middle">250</text>
  </g>

  <!-- Golden Perimeter Bulb Lights -->
  <g fill="#fef08a" filter="url(#goldGlow)">
    <circle cx="256" cy="22" r="6" />
    <circle cx="347" cy="40" r="6" />
    <circle cx="421" cy="91" r="6" />
    <circle cx="472" cy="165" r="6" />
    <circle cx="490" cy="256" r="6" />
    <circle cx="472" cy="347" r="6" />
    <circle cx="421" cy="421" r="6" />
    <circle cx="347" cy="472" r="6" />
    <circle cx="256" cy="490" r="6" />
    <circle cx="165" cy="472" r="6" />
    <circle cx="91" cy="421" r="6" />
    <circle cx="40" cy="347" r="6" />
    <circle cx="22" cy="256" r="6" />
    <circle cx="40" cy="165" r="6" />
    <circle cx="91" cy="91" r="6" />
    <circle cx="165" cy="40" r="6" />
  </g>

  <!-- Center Hub Base -->
  <circle cx="256" cy="256" r="60" fill="#0f172a" stroke="#78350f" stroke-width="4" />
  <circle cx="256" cy="256" r="50" fill="url(#hubGrad)" stroke="#fef08a" stroke-width="3" />
  <circle cx="256" cy="256" r="38" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="4,3" />
  <text x="256" y="265" font-family="system-ui, sans-serif" font-size="22" font-weight="950" fill="#78350f" text-anchor="middle">BW</text>
</svg>
