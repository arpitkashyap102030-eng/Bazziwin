<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ctBgNew" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="greenOrbNew" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="85%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
    <radialGradient id="violetOrbNew" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0abfc" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#3b0764" />
    </radialGradient>
    <radialGradient id="redOrbNew" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <filter id="ctGlowNew" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="32" fill="url(#ctBgNew)" />
  <rect width="504" height="504" x="4" y="4" rx="28" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35" />

  <!-- Candlestick Trading Trend in Background -->
  <g opacity="0.25">
    <line x1="60" y1="200" x2="60" y2="440" stroke="#22c55e" stroke-width="2" />
    <rect x="52" y="240" width="16" height="80" rx="3" fill="#22c55e" />

    <line x1="120" y1="180" x2="120" y2="420" stroke="#ef4444" stroke-width="2" />
    <rect x="112" y="220" width="16" height="100" rx="3" fill="#ef4444" />

    <line x1="390" y1="200" x2="390" y2="440" stroke="#22c55e" stroke-width="2" />
    <rect x="382" y="230" width="16" height="90" rx="3" fill="#22c55e" />

    <line x1="450" y1="180" x2="450" y2="420" stroke="#ef4444" stroke-width="2" />
    <rect x="442" y="260" width="16" height="70" rx="3" fill="#ef4444" />
  </g>

  <!-- 3 Glowing Primary Color Balls (Green, Violet, Red) -->
  <!-- Green Orb -->
  <g transform="translate(110, 185)" filter="url(#ctGlowNew)">
    <circle cx="0" cy="0" r="54" fill="url(#greenOrbNew)" stroke="#86efac" stroke-width="3" />
    <circle cx="-16" cy="-16" r="10" fill="#ffffff" opacity="0.6" />
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="22" font-weight="950" fill="#ffffff" text-anchor="middle">2X</text>
    <rect x="-42" y="65" width="84" height="26" rx="13" fill="#052e16" stroke="#22c55e" stroke-width="1.5" />
    <text x="0" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#4ade80" text-anchor="middle">GREEN</text>
  </g>

  <!-- Violet Orb (Center Jewel) -->
  <g transform="translate(256, 165)" filter="url(#ctGlowNew)">
    <circle cx="0" cy="0" r="62" fill="url(#violetOrbNew)" stroke="#f0abfc" stroke-width="3.5" />
    <circle cx="-18" cy="-18" r="12" fill="#ffffff" opacity="0.65" />
    <text x="0" y="9" font-family="system-ui, sans-serif" font-size="26" font-weight="950" fill="#ffffff" text-anchor="middle">4.5X</text>
    <rect x="-46" y="74" width="92" height="28" rx="14" fill="#3b0764" stroke="#c084fc" stroke-width="1.5" />
    <text x="0" y="93" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#e879f9" text-anchor="middle">VIOLET</text>
  </g>

  <!-- Red Orb -->
  <g transform="translate(402, 185)" filter="url(#ctGlowNew)">
    <circle cx="0" cy="0" r="54" fill="url(#redOrbNew)" stroke="#fca5a5" stroke-width="3" />
    <circle cx="-16" cy="-16" r="10" fill="#ffffff" opacity="0.6" />
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="22" font-weight="950" fill="#ffffff" text-anchor="middle">2X</text>
    <rect x="-38" y="65" width="76" height="26" rx="13" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
    <text x="0" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#f87171" text-anchor="middle">RED</text>
  </g>

  <!-- Lucky Numbers 0-9 Bottom Strip (BDG / Wingo Style) -->
  <g transform="translate(46, 360)">
    <rect width="420" height="65" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- 0 (Red/Violet) -->
    <circle cx="30" cy="32" r="16" fill="#c084fc" stroke="#ef4444" stroke-width="3" />
    <text x="30" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">0</text>
    <!-- 1 (Green) -->
    <circle cx="72" cy="32" r="16" fill="#22c55e" />
    <text x="72" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    <!-- 2 (Red) -->
    <circle cx="114" cy="32" r="16" fill="#ef4444" />
    <text x="114" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    <!-- 3 (Green) -->
    <circle cx="156" cy="32" r="16" fill="#22c55e" />
    <text x="156" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    <!-- 4 (Red) -->
    <circle cx="198" cy="32" r="16" fill="#ef4444" />
    <text x="198" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
    <!-- 5 (Green/Violet) -->
    <circle cx="240" cy="32" r="16" fill="#c084fc" stroke="#22c55e" stroke-width="3" />
    <text x="240" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
    <!-- 6 (Red) -->
    <circle cx="282" cy="32" r="16" fill="#ef4444" />
    <text x="282" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">6</text>
    <!-- 7 (Green) -->
    <circle cx="324" cy="32" r="16" fill="#22c55e" />
    <text x="324" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">7</text>
    <!-- 8 (Red) -->
    <circle cx="366" cy="32" r="16" fill="#ef4444" />
    <text x="366" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">8</text>
    <!-- 9 (Green) -->
    <circle cx="408" cy="32" r="16" fill="#22c55e" />
    <text x="408" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">9</text>
  </g>

  <!-- Big 9X Return Badge in Footer -->
  <text x="256" y="468" font-family="system-ui, monospace" font-size="16" font-weight="900" fill="#facc15" text-anchor="middle">⚡ NUMBERS PAY 9X · BIG / SMALL 2X</text>

  <!-- Title Badge Top -->
  <g transform="translate(106, 38)">
    <rect width="300" height="48" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="2.5" filter="url(#ctGlowNew)" />
    <text x="150" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="950" fill="#f0abfc" text-anchor="middle">COLOUR TRADING</text>
  </g>
</svg>
