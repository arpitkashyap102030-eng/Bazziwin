<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <linearGradient id="horseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" fill="url(#skyGrad)" />

  <!-- Circular Stadium Arena Glow -->
  <ellipse cx="256" cy="360" rx="220" ry="110" fill="#14532d" opacity="0.4" />
  <ellipse cx="256" cy="360" rx="200" ry="90" fill="none" stroke="url(#trackGrad)" stroke-width="24" opacity="0.8" />
  <ellipse cx="256" cy="360" rx="170" ry="75" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Stadium Floodlights Glow -->
  <circle cx="100" cy="90" r="6" fill="#ffffff" filter="url(#glow)" />
  <path d="M 100 90 L 180 340 L 40 340 Z" fill="#ffffff" opacity="0.08" />
  <circle cx="412" cy="90" r="6" fill="#ffffff" filter="url(#glow)" />
  <path d="M 412 90 L 480 340 L 340 340 Z" fill="#ffffff" opacity="0.08" />

  <!-- Dynamic Galloping Thoroughbred Horse Silhouette & Jockey -->
  <g transform="translate(130, 150) scale(1.1)">
    <!-- Motion Dust -->
    <ellipse cx="30" cy="180" rx="28" ry="8" fill="#d97706" opacity="0.3" filter="url(#glow)" />
    <ellipse cx="60" cy="175" rx="18" ry="6" fill="#d97706" opacity="0.4" />

    <!-- Horse Body (Powerful Muscular Form) -->
    <!-- Hind Legs Extended Back -->
    <path d="M 60 110 Q 40 140 20 170 Q 25 174 35 168 Q 55 140 75 125 Z" fill="#92400e" />
    <path d="M 75 110 Q 60 145 45 180 Q 52 182 60 176 Q 80 145 95 125 Z" fill="#78350f" />

    <!-- Main Torso & Flank -->
    <path d="M 65 100 C 70 85, 120 75, 160 85 C 190 92, 205 110, 195 125 C 165 140, 110 140, 65 100 Z" fill="url(#horseGrad)" />

    <!-- Muscular Neck & Head -->
    <path d="M 155 88 C 175 60, 200 45, 225 35 C 235 30, 245 35, 240 45 C 230 58, 220 70, 210 75 C 215 80, 218 85, 205 92 C 185 102, 170 100, 155 88 Z" fill="url(#horseGrad)" />
    <!-- Horse Ears -->
    <path d="M 225 35 L 230 20 L 235 34 Z" fill="#78350f" />
    <!-- Horse Muzzle & Bridle -->
    <path d="M 235 42 L 246 47 L 242 54 L 232 48 Z" fill="#451a03" />
    <path d="M 228 38 L 242 50" stroke="#fef08a" stroke-width="2" />

    <!-- Flowing Mane & Tail in Motion -->
    <path d="M 65 100 C 40 105, 20 120, 5 140 C 15 130, 35 120, 55 115 Z" fill="#451a03" />
    <path d="M 175 65 C 165 50, 155 55, 145 68 C 160 62, 170 60, 180 62 Z" fill="#451a03" />

    <!-- Forelegs Reaching Forward in Gallop -->
    <path d="M 175 115 Q 195 135, 225 155 Q 232 153, 228 145 Q 200 130, 185 105 Z" fill="url(#horseGrad)" />
    <path d="M 160 115 Q 180 145, 205 175 Q 212 173, 208 165 Q 185 138, 170 108 Z" fill="#78350f" />

    <!-- Jockey in Racing Stance (Aerodynamic Tuck) -->
    <!-- Jockey Body & Silk (Vibrant Red & Gold) -->
    <path d="M 125 75 C 135 60, 155 55, 168 68 C 160 80, 145 85, 125 75 Z" fill="#dc2626" />
    <!-- Jockey Helmet & Goggles -->
    <circle cx="165" cy="50" r="10" fill="#fbbf24" />
    <path d="M 168 49 Q 174 50 174 53 Q 168 56 163 53 Z" fill="#0f172a" />
    <!-- Jockey Reins & Arm -->
    <path d="M 152 68 L 185 70 L 215 55" stroke="#fef08a" stroke-width="2" fill="none" />
    <!-- Jockey White Breeches & Boot -->
    <path d="M 118 78 Q 130 85 136 96 L 126 100 Q 118 88 118 78 Z" fill="#f8fafc" />
    <path d="M 136 96 L 140 104 L 132 106 Z" fill="#0f172a" />
  </g>

  <!-- Speed Motion Lines -->
  <line x1="30" y1="260" x2="160" y2="260" stroke="#38bdf8" stroke-width="2" opacity="0.4" stroke-dasharray="12 12" />
  <line x1="60" y1="290" x2="210" y2="290" stroke="#fbbf24" stroke-width="2" opacity="0.4" stroke-dasharray="20 10" />

  <!-- Badge / Bottom Title Banner -->
  <rect x="36" y="420" width="440" height="64" rx="16" fill="#090d16" stroke="#fbbf24" stroke-width="2" opacity="0.95" />
  <text x="256" y="452" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="2">3D DERBY RACING</text>
  <text x="256" y="472" fill="#fbbf24" font-family="ui-monospace, monospace" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1">LIVE CIRCULAR STADIUM TRACK · PROVABLY FAIR</text>
</svg>
