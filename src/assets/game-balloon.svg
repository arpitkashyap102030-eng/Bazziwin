<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="balloonSky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="balloonBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="20%" stop-color="#f472b6" />
      <stop offset="60%" stop-color="#db2777" />
      <stop offset="90%" stop-color="#9d174d" />
      <stop offset="100%" stop-color="#500724" />
    </radialGradient>
    <linearGradient id="yellowStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="balloonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="32" fill="url(#balloonSky)" />
  <rect width="504" height="504" x="4" y="4" rx="28" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.3" />

  <!-- Confetti / Floating Stars -->
  <g fill="#fef08a" opacity="0.7">
    <circle cx="80" cy="160" r="3" />
    <circle cx="430" cy="120" r="4" />
    <circle cx="90" cy="380" r="2.5" />
    <circle cx="420" cy="360" r="3" />
    <polygon points="120,240 124,244 120,248 116,244" fill="#38bdf8" />
    <polygon points="380,240 384,244 380,248 376,244" fill="#4ade80" />
  </g>

  <!-- Giant Shiny Hot Air / Party Balloon -->
  <g transform="translate(256, 230)" filter="url(#balloonGlow)">
    <!-- Balloon Sphere -->
    <circle cx="0" cy="0" r="120" fill="url(#balloonBody)" stroke="#fbcfe8" stroke-width="3" />

    <!-- Yellow / Gold Accent Arc Stripes -->
    <path d="M -60,-80 Q 0,-20 -60,80" fill="none" stroke="url(#yellowStripe)" stroke-width="14" stroke-linecap="round" opacity="0.8" />
    <path d="M 60,-80 Q 0,-20 60,80" fill="none" stroke="url(#yellowStripe)" stroke-width="14" stroke-linecap="round" opacity="0.8" />

    <!-- Big Shiny Specular Highlight -->
    <ellipse cx="-45" cy="-55" rx="32" ry="18" fill="#ffffff" transform="rotate(-30 -45 -55)" opacity="0.85" />
    <circle cx="-15" cy="-75" r="7" fill="#ffffff" opacity="0.9" />

    <!-- Balloon Knot Bottom -->
    <polygon points="-16,118 16,118 22,136 -22,136" fill="#be185d" stroke="#fbcfe8" stroke-width="1.5" />

    <!-- Air Pump Inflation Hose -->
    <path d="M 0,136 Q 30,170 80,200" fill="none" stroke="#facc15" stroke-width="5" stroke-dasharray="6,4" />

    <!-- Center Multiplier Display inside Balloon -->
    <rect x="-65" y="-22" width="130" height="44" rx="12" fill="#0f172a" stroke="#facc15" stroke-width="2" />
    <text x="0" y="8" font-family="system-ui, monospace" font-size="24" font-weight="950" fill="#facc15" text-anchor="middle">5.60x 🎈</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(146, 44)">
    <rect width="220" height="48" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="2.5" />
    <text x="110" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="950" fill="#f472b6" text-anchor="middle">BALLOON</text>
  </g>
</svg>
