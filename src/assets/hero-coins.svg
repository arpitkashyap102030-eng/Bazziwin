<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <defs>
    <radialGradient id="glowBack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <linearGradient id="edgeGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="bloomGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Backing -->
  <ellipse cx="200" cy="190" rx="180" ry="120" fill="url(#glowBack)" />

  <!-- Background Floating Sparkles -->
  <g fill="#fef08a">
    <polygon points="50,60 54,75 69,79 54,83 50,98 46,83 31,79 46,75" opacity="0.9" />
    <polygon points="340,80 343,92 355,95 343,98 340,110 337,98 325,95 337,92" opacity="0.85" />
    <polygon points="300,240 302,250 312,252 302,254 300,264 298,254 288,252 298,250" opacity="0.8" />
    <polygon points="90,260 92,270 102,272 92,274 90,284 88,274 78,272 88,270" opacity="0.75" />
  </g>

  <!-- 100 COINS BONUS BADGE PILL (Floating Top Right) -->
  <g transform="translate(240, 40)">
    <rect width="130" height="38" rx="19" fill="#1e1b4b" stroke="#facc15" stroke-width="2.5" filter="url(#bloomGlow)" />
    <text x="65" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="950" fill="#facc15" text-anchor="middle">+100 COINS</text>
  </g>

  <!-- Bottom Coin Stacks & Layers -->
  <!-- Left Bottom Coin Stack -->
  <g transform="translate(60, 180) rotate(-14)">
    <ellipse cx="70" cy="40" rx="68" ry="30" fill="url(#edgeGold)" />
    <ellipse cx="70" cy="25" rx="68" ry="30" fill="url(#goldShine)" stroke="#fef08a" stroke-width="2.5" />
    <ellipse cx="70" cy="25" rx="52" ry="22" fill="none" stroke="#92400e" stroke-width="2" stroke-dasharray="6,4" />
    <text x="70" y="33" font-family="system-ui, sans-serif" font-size="22" font-weight="950" fill="#78350f" text-anchor="middle">BW</text>
  </g>

  <!-- Right Bottom Coin Stack -->
  <g transform="translate(190, 175) rotate(18)">
    <ellipse cx="70" cy="40" rx="68" ry="30" fill="url(#edgeGold)" />
    <ellipse cx="70" cy="25" rx="68" ry="30" fill="url(#goldShine)" stroke="#fef08a" stroke-width="2.5" />
    <ellipse cx="70" cy="25" rx="52" ry="22" fill="none" stroke="#92400e" stroke-width="2" stroke-dasharray="6,4" />
    <text x="70" y="33" font-family="system-ui, sans-serif" font-size="22" font-weight="950" fill="#78350f" text-anchor="middle">BW</text>
  </g>

  <!-- Center-Left Mid Stack -->
  <g transform="translate(100, 130) rotate(-5)">
    <ellipse cx="75" cy="42" rx="72" ry="32" fill="url(#edgeGold)" />
    <ellipse cx="75" cy="26" rx="72" ry="32" fill="url(#goldShine)" stroke="#fef08a" stroke-width="2.5" />
    <ellipse cx="75" cy="26" rx="55" ry="23" fill="none" stroke="#92400e" stroke-width="2" stroke-dasharray="6,4" />
    <text x="75" y="35" font-family="system-ui, sans-serif" font-size="24" font-weight="950" fill="#78350f" text-anchor="middle">BW</text>
  </g>

  <!-- Main Giant Front Hero Coin -->
  <g transform="translate(115, 80) rotate(8)" filter="url(#bloomGlow)">
    <ellipse cx="80" cy="46" rx="82" ry="38" fill="url(#edgeGold)" />
    <ellipse cx="80" cy="28" rx="82" ry="38" fill="url(#goldShine)" stroke="#ffffff" stroke-width="3" />
    <ellipse cx="80" cy="28" rx="62" ry="28" fill="none" stroke="#78350f" stroke-width="2.5" stroke-dasharray="8,5" />
    <text x="80" y="39" font-family="system-ui, sans-serif" font-size="32" font-weight="950" fill="#78350f" text-anchor="middle">BW</text>
  </g>
</svg>
