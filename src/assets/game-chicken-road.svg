<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky & Asphalt Gradients -->
    <linearGradient id="crSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#0369a1" />
      <stop offset="70%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Asphalt Highway Gradient with Perspective -->
    <linearGradient id="crAsphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="crGoldChicken" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="carRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <filter id="crGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="32" fill="url(#crSky)" />
  <rect width="504" height="504" x="4" y="4" rx="28" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Sun & Clouds in Background -->
  <circle cx="90" cy="110" r="45" fill="#facc15" opacity="0.8" filter="url(#crGlow)" />
  <path d="M 320,100 Q 340,75 370,85 Q 400,75 420,100 Q 440,115 410,130 L 320,130 Z" fill="#ffffff" opacity="0.4" />

  <!-- Asphalt Road with Multi-Lane Highway Perspective -->
  <polygon points="170,180 342,180 490,512 22,512" fill="url(#crAsphalt)" stroke="#475569" stroke-width="3" />

  <!-- Road Shoulder & Sidewalk Curbs -->
  <polygon points="170,180 180,180 38,512 22,512" fill="#ef4444" />
  <polygon points="332,180 342,180 490,512 474,512" fill="#ef4444" />
  <polygon points="175,180 180,180 42,512 38,512" fill="#ffffff" />
  <polygon points="337,180 342,180 486,512 482,512" fill="#ffffff" />

  <!-- Dashed Highway Center Striping -->
  <g stroke="#facc15" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="200" x2="256" y2="230" stroke-width="3" />
    <line x1="256" y1="250" x2="256" y2="295" stroke-width="5" />
    <line x1="256" y1="325" x2="256" y2="385" stroke-width="8" />
    <line x1="256" y1="420" x2="256" y2="505" stroke-width="12" />
  </g>

  <!-- Speeding Sports Car Obstacle Zooming Past -->
  <g transform="translate(370, 360) rotate(-12)" filter="url(#crGlow)">
    <!-- Car Body -->
    <path d="M -50,-10 L -25,-30 L 35,-30 L 60,-10 L 65,15 L -55,15 Z" fill="url(#carRed)" stroke="#fee2e2" stroke-width="2" />
    <!-- Windshield -->
    <polygon points="-20,-26 30,-26 48,-10 -35,-10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Headlights & Yellow Glow -->
    <ellipse cx="62" cy="5" rx="6" ry="4" fill="#fef08a" />
    <ellipse cx="62" cy="5" rx="16" ry="8" fill="#fef08a" opacity="0.4" />
    <!-- Wheels -->
    <circle cx="-35" cy="16" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    <circle cx="45" cy="16" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    <!-- Tire Smoke -->
    <circle cx="-55" cy="22" r="12" fill="#cbd5e1" opacity="0.6" />
    <circle cx="-75" cy="18" r="16" fill="#cbd5e1" opacity="0.4" />
  </g>

  <!-- The Cool Hero Chicken Hopping across Road -->
  <g transform="translate(185, 320)" filter="url(#crGlow)">
    <!-- Running Shadow -->
    <ellipse cx="0" cy="95" rx="45" ry="14" fill="#000000" opacity="0.5" />

    <!-- Red Sneakers / Running Shoes -->
    <g fill="#ef4444" stroke="#ffffff" stroke-width="2">
      <!-- Left Foot -->
      <path d="M -40,78 L -15,78 L -10,95 L -45,95 Z" rx="4" />
      <!-- Right Foot in Air -->
      <path d="M 15,65 L 42,65 L 48,82 L 10,82 Z" rx="4" />
    </g>
    <!-- Legs -->
    <line x1="-25" y1="55" x2="-25" y2="80" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <line x1="25" y1="55" x2="28" y2="68" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

    <!-- Fluffy Golden Chicken Body -->
    <ellipse cx="0" cy="25" rx="65" ry="52" fill="url(#crGoldChicken)" stroke="#d97706" stroke-width="3" />

    <!-- Red Wing with Feathers -->
    <path d="M -30,20 C -60,25 -55,55 -25,45 Z" fill="#ea580c" stroke="#fff" stroke-width="1.5" />

    <!-- Big Chicken Head -->
    <circle cx="28" cy="-25" r="40" fill="url(#crGoldChicken)" stroke="#d97706" stroke-width="2.5" />

    <!-- Red Comb on Head -->
    <path d="M 12,-62 C 18,-80 32,-75 30,-62 C 38,-78 52,-70 46,-56 C 56,-65 65,-50 50,-42 Z" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />

    <!-- Dark Aviator Sunglasses on Chicken -->
    <polygon points="16,-34 38,-34 34,-18 20,-18" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
    <polygon points="42,-34 64,-34 60,-18 46,-18" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
    <line x1="38" y1="-28" x2="42" y2="-28" stroke="#f59e0b" stroke-width="3" />
    <!-- White Glare on Sunglasses -->
    <line x1="22" y1="-30" x2="30" y2="-22" stroke="#ffffff" stroke-width="2" />
    <line x1="48" y1="-30" x2="56" y2="-22" stroke="#ffffff" stroke-width="2" />

    <!-- Yellow-Orange Beak -->
    <polygon points="56,-14 88,-8 56,2" fill="#f97316" stroke="#c2410c" stroke-width="2" />

    <!-- Golden Coin in Claw -->
    <circle cx="-50" cy="5" r="18" fill="#facc15" stroke="#ffffff" stroke-width="2" filter="url(#crGlow)" />
    <text x="-50" y="11" font-family="system-ui, sans-serif" font-size="16" font-weight="950" fill="#78350f" text-anchor="middle">$</text>
  </g>

  <!-- Multiplier Lane Markers (1.25x -> 25.00x) Floating in Air -->
  <g transform="translate(70, 200)" filter="url(#crGlow)">
    <rect width="84" height="28" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2" />
    <text x="42" y="19" font-family="system-ui, monospace" font-size="14" font-weight="900" fill="#4ade80" text-anchor="middle">1.25x 🍗</text>
  </g>

  <g transform="translate(360, 200)" filter="url(#crGlow)">
    <rect width="90" height="28" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="2" />
    <text x="45" y="19" font-family="system-ui, monospace" font-size="14" font-weight="900" fill="#facc15" text-anchor="middle">25.00x 🏆</text>
  </g>

  <!-- Title Badge Top Header -->
  <g transform="translate(106, 32)" filter="url(#crGlow)">
    <rect width="300" height="52" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="3.5" />
    <text x="150" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="950" fill="#facc15" text-anchor="middle" letter-spacing="1.5">CHICKEN ROAD</text>
  </g>
</svg>
